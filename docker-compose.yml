services:
  db:
    image: postgres:16-alpine
    container_name: booking-own-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-booking_own}
      POSTGRES_USER: ${POSTGRES_USER:-booking_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booking_password}
    ports:
      - "5432:5432"
    volumes:
      - booking-own-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_user -d booking_own"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: booking-own-app
    working_dir: /app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://booking_user:booking_password@db:5432/booking_own
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      # When set to 1, our next.config.ts will skip the turbopack option and
      # allow Next to run with the webpack watcher which tends to be more
      # reliable in containerized development.
      DISABLE_TURBOPACK: "1"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - booking-own-node-modules:/app/node_modules
    # Force the dev command with turbopack disabled so arguments are passed
    # consistently when docker compose starts the container. Use a small
    # shell wrapper that sets the internal NEXT_PRIVATE_TURBOPACK env var to
    # disable turbopack and fall back to the webpack watcher which is more
    # reliable inside container mounts.
    command: ["sh", "-c", "export NEXT_PRIVATE_TURBOPACK=0; npm run dev -- --hostname 0.0.0.0"]

volumes:
  booking-own-postgres-data:
  booking-own-node-modules:
